<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>EazyCV | Sign Up</title>
   <link rel="icon" href="images/logowc.png" >
   <link rel="stylesheet" href="styles/home.css">
   <link rel="stylesheet" href="styles/login.css">
</head>
<body>
   <header class="site-header">
     <nav class="nav">
       <a href="index.html" class="nav__brand nav__logo" aria-label="EazyCV home">
         <img src="images/logow.png" alt="EazyCV logo">
       </a>
       <button class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false">
         <span></span>
         <span></span>
       </button>
       <div class="nav__menu">
         <ul class="nav__links">
           <li><a href="index.html#top" class="nav__link">Home</a></li>
           <li><a href="index.html#how-it-works" class="nav__link">How it works</a></li>
           <li><a href="index.html#templates" class="nav__link">Templates</a></li>
           <li><a href="index.html#contact" class="nav__link">Contact</a></li>
         </ul>
         <div class="nav__actions">
           <a href="login.html" class="nav__auth nav__auth--ghost">Log In</a>
           <a href="signup.html" class="nav__auth nav__auth--primary">Sign Up</a>
         </div>
       </div>
     </nav>
   </header>
   <div class="centerwrapper">
     <div class="container">
       <h2>Create your free EazyCV profile</h2>
       <p class="auth-intro">Use a basic email and password to keep your CV settings on this device. No external account is created.</p>
       <hr>
       <form id="signup-form">
           <label for="email" class="labels">Email</label>
           <input type="email" id="email" name="email" placeholder="Enter Email" required>
           <label for="password" class="labels">Password</label>
           <input type="password" id="password" name="password" placeholder="Enter Password" required>
           <label for="confirm-password" class="labels">Confirm Password</label>
           <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required>
            <div class="options">
       </div>
      <center><button type="submit" class="btn">Sign Up</button></center>
      <center><label for="">already have an account?</label>
       <a href="./login.html">Log In</a></center> 
       </form>
       <p id="message" style="color: red;"></p>
     </div>
   </div>

   <script src="js/auth.js"></script>
   <script src="js/signup.js"></script>
   <script src="js/nav.js"></script>
</body>
</html>

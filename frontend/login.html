<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>EazyCV | Login</title>
   <link rel="icon" href="images/logowc.png" >
   <link rel="stylesheet" href="styles/home.css">
   <link rel="stylesheet" href="styles/login.css">
</head>
<body>
   <header class="site-header">
     <nav class="nav">
       <a href="index.html" class="nav__brand nav__logo" aria-label="EazyCV home">
         <img src="images/logow.png" alt="EazyCV logo">
       </a>
       <button class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false">
         <span></span>
         <span></span>
       </button>
       <div class="nav__menu">
         <ul class="nav__links">
           <li><a href="index.html" class="nav__link">Home</a></li>
           <li><a href="#" class="nav__link">About</a></li>
           <li><a href="#" class="nav__link">Templates</a></li>
           <li><a href="#" class="nav__link">Contact</a></li>
         </ul>
         <div class="nav__actions">
           <a href="login.html" class="nav__auth nav__auth--ghost">Log In</a>
           <a href="signup.html" class="nav__auth nav__auth--primary">Sign Up</a>
         </div>
       </div>
     </nav>
   </header>
   <div class="centerwrapper">
     <div class="container">
       <h2>Log In</h2><br>
       <hr>
       <br>
       <form id="login-form">
           <label for="email" class="labels">Email</label>
           <input type="email" id="email" name="email" placeholder="Enter Email" required>
           <label for="password" class="labels">Password</label>
           <input type="password" id="password" name="password" placeholder="Enter Password" required>
            <div class="options">
       </div><br>
       <center><button type="submit" class="btn">Log In</button></center>
      <center><label for="">You don't have an account?</label>
       <a href="./signup.html">Signup</a></center> 
       </form>
       <p id="error-message" style="color: red;"></p>
     </div>
   </div>

   <script src="js/login.js"></script>
   <script src="js/nav.js"></script>
</body>
</html>
